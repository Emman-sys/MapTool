<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MapTool Screenshot Settings</title>
    <style>
      body {
        font: 14px/1.5 system-ui, sans-serif;
        margin: 2rem auto;
        max-width: 32rem;
        padding: 0 1rem;
      }
      form {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      label {
        display: grid;
        gap: 0.25rem;
      }
      input {
        padding: 0.45rem;
      }
      button {
        grid-column: 1 / -1;
        justify-self: start;
        padding: 0.5rem 1rem;
      }
      #select-area {
        margin: 0 0 1rem;
      }
      #status {
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <h1>Screenshot area</h1>
    <p>Choose an area on the webpage or enter its position and size in CSS pixels.</p>
    <button id="select-area" type="button">Select area on page</button>
    <form id="area-form">
      <label>X <input name="x" type="number" min="0" step="1" required></label>
      <label>Y <input name="y" type="number" min="0" step="1" required></label>
      <label>Width <input name="width" type="number" min="1" step="1" required></label>
      <label>Height <input name="height" type="number" min="1" step="1" required></label>
      <button type="submit">Save area</button>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="options.js"></script>
  </body>
</html>
